
events {}

http {
    server {
        listen 80;

        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            proxy_pass http://todo-backend:3000/;
        }

        location /todos {
            proxy_pass http://todo-backend:3000;
        }

        location /statistics {
            proxy_pass http://todo-backend:3000;
        }

        location / {
            proxy_pass http://frontend:5173;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
