services:
  nginx:
    image: nginx:1.21.6
    ports:
      - "8080:80"
    depends_on:
      - frontend
  frontend:
    build: ./todo-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:8080/api
    volumes:
      - ./todo-frontend:/usr/src/app
      - /usr/src/app/node_modules
services:
  app:
    build: ./todo-frontend
    ports:
      - 4173:4173
    environment:
      - VITE_BACKEND_URL=http://localhost:8080/api
    # Volumes removed for production
    # command: npm run preview -- --host 0.0.0.0

  backend:
    build: ./todo-backend
    ports:
      - 3000:3000
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://mongo:27017/todo_db

  mongo:
    image: mongo:8
    # Removed MONGO_INITDB_ROOT_USERNAME and MONGO_INITDB_ROOT_PASSWORD for simpler setup
    # MONGO_INITDB_DATABASE is still set to todo_db
    volumes:
      - mongo-data:/docker-entrypoint-initdb.d

  redis:
    image: redis:latest
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  nginx:
    image: nginx:1.29
    ports:
      - 8080:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - backend

volumes:
  mongo-data:
  redis-data: